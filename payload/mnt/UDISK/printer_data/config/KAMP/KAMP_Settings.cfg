# Mesh-only review candidate. Primary slicer: Creality Print 7.3 over LAN.
[include Adaptive_Meshing.cfg]
[include Full_Bed_Calibrate.cfg]
[include Guarded_Commands.cfg]

[gcode_macro _KAMP_Settings]
variable_verbose_enable: True
variable_mesh_margin: 5
variable_fuzz_amount: 0
variable_probe_dock_enable: False
variable_attach_macro: 'Attach_Probe'
variable_detach_macro: 'Dock_Probe'
gcode:
    {action_respond_info("KAMP v2: mesh only, session map, guarded start")}
