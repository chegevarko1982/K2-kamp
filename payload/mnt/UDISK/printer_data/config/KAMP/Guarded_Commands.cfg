# The original Creality handler is retained but never used for adaptive probing.
# Public early calls cannot probe, even with stale exclude_object data.
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _KAMP_CREALITY_BMC
gcode:
    M118 KAMP: stock calibration deferred; use KAMP_FULL_BED_CALIBRATE manually

# Homing's LOAD=default restores the in-memory adaptive mesh during a session.
# No temporary mesh is put in ProfileManager/configfile pending changes.
[gcode_macro BED_MESH_PROFILE]
rename_existing: _KAMP_PROFILE_BASE
gcode:
    {% if printer.restore_bed_mesh.active or printer.restore_bed_mesh.recovering %}
        {% if params.LOAD|default('')|lower == 'default' and 'SAVE' not in params and 'REMOVE' not in params %}
            KAMP_RESTORE_SESSION
        {% else %}
            _KAMP_REFUSE_PROFILE
        {% endif %}
    {% else %}
        _KAMP_PROFILE_BASE {rawparams}
    {% endif %}

# Entry validates a persisted, job-bound snapshot before stock heating/motion.
[gcode_macro SDCARD_PRINT_FILE]
rename_existing: _KAMP_SDCARD_BASE
gcode:
    KAMP_START_FILE {rawparams}

# Execute preparation under a Python try/finally, including the original body.
[gcode_macro CX_ROUGH_G28]
rename_existing: _KAMP_ROUGH_BASE
gcode:
    KAMP_ROUGH_HOME ORIGINAL=1 {rawparams}

# Homing calls z_align.cmd_ZDOWN directly; this entry uses the same verified hook.
[gcode_macro ZDOWN]
rename_existing: _KAMP_ZDOWN_BASE
gcode:
    KAMP_ZDOWN {rawparams}

[gcode_macro FORCE_MOVE]
rename_existing: _KAMP_FORCE_MOVE_BASE
gcode:
    KAMP_NOTE_Z_CHANGE {rawparams}
    _KAMP_FORCE_MOVE_BASE {rawparams}

[gcode_macro SET_STEPPER_ENABLE]
rename_existing: _KAMP_STEPPER_ENABLE_BASE
gcode:
    KAMP_NOTE_Z_CHANGE {rawparams}
    _KAMP_STEPPER_ENABLE_BASE {rawparams}

[gcode_macro BED_MESH_CLEAR]
rename_existing: _KAMP_MESH_CLEAR_BASE
gcode:
    KAMP_CLEAR_MESH {rawparams}

[gcode_macro BED_MESH_OFFSET]
rename_existing: _KAMP_MESH_OFFSET_BASE
gcode:
    KAMP_OFFSET_MESH {rawparams}

[gcode_macro Z_TILT_ADJUST]
rename_existing: _KAMP_TILT_BASE
gcode:
    KAMP_TILT {rawparams}

[gcode_macro ADJUST_STEPPERS]
rename_existing: _KAMP_ADJUST_BASE
gcode:
    KAMP_ADJUST {rawparams}

[gcode_macro M24]
rename_existing: M24.1
gcode:
    KAMP_CHECK_RESUME
    M24.1 {rawparams}

# Keep the other stock in-memory backup commands from replacing or exposing
# the session map through a side channel.
[gcode_macro BED_MESH_SAVE]
rename_existing: _KAMP_MESH_SAVE_BASE
gcode:
    {% if printer.restore_bed_mesh.active or printer.restore_bed_mesh.recovering %}
        _KAMP_REFUSE_PROFILE
    {% else %}
        _KAMP_MESH_SAVE_BASE {rawparams}
    {% endif %}

[gcode_macro BED_MESH_RESTORE]
rename_existing: _KAMP_MESH_RESTORE_BASE
gcode:
    {% if printer.restore_bed_mesh.active or printer.restore_bed_mesh.recovering %}
        KAMP_RESTORE_SESSION
    {% else %}
        _KAMP_MESH_RESTORE_BASE {rawparams}
    {% endif %}
