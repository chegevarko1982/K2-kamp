# The original Creality handler is retained but never used for adaptive probing.
# Public early calls cannot probe, even with stale exclude_object data.
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _KAMP_CREALITY_BMC
gcode:
    M118 KAMP: stock calibration deferred; use KAMP_FULL_BED_CALIBRATE manually

# Homing's LOAD=default restores the in-memory adaptive mesh during a session.
# No temporary mesh is put in ProfileManager/configfile pending changes.
[gcode_macro BED_MESH_PROFILE]
rename_existing: _KAMP_PROFILE_BASE
gcode:
    {% if printer.restore_bed_mesh.active %}
        {% if params.LOAD|default('')|lower == 'default' and 'SAVE' not in params and 'REMOVE' not in params %}
            KAMP_RESTORE_SESSION
        {% else %}
            _KAMP_REFUSE_PROFILE
        {% endif %}
    {% else %}
        _KAMP_PROFILE_BASE {rawparams}
    {% endif %}

# A session mesh is unavailable after a reboot. Refuse the known Creality
# recovery entry point before its original handler can heat or move anything.
[gcode_macro SDCARD_PRINT_FILE]
rename_existing: _KAMP_SDCARD_BASE
gcode:
    {% if 'ISCONTINUEPRINT' in params %}
        _KAMP_REJECT_RECOVERY
    {% else %}
        KAMP_PREPARE_FILE
        _KAMP_SDCARD_BASE {rawparams}
    {% endif %}

[gcode_macro M24]
rename_existing: M24.1
gcode:
    KAMP_CHECK_RESUME
    M24.1 {rawparams}

# Keep the other stock in-memory backup commands from replacing or exposing
# the session map through a side channel.
[gcode_macro BED_MESH_SAVE]
rename_existing: _KAMP_MESH_SAVE_BASE
gcode:
    {% if printer.restore_bed_mesh.active %}
        _KAMP_REFUSE_PROFILE
    {% else %}
        _KAMP_MESH_SAVE_BASE {rawparams}
    {% endif %}

[gcode_macro BED_MESH_RESTORE]
rename_existing: _KAMP_MESH_RESTORE_BASE
gcode:
    {% if printer.restore_bed_mesh.active %}
        KAMP_RESTORE_SESSION
    {% else %}
        _KAMP_MESH_RESTORE_BASE {rawparams}
    {% endif %}
